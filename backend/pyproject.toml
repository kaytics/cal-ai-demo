[project]
name = "cal-ai-permitting-backend"
version = "0.1.0"
description = "CA AI Permitting Showcase — Python + FastMCP backend (ADR-0002)"
requires-python = ">=3.11"
dependencies = [
    "ag-ui-protocol==0.1.20",
    "pydantic>=2.11.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "fastmcp>=3.4.7",
]

[project.optional-dependencies]
agent = ["boto3>=1.34"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "import-linter>=2.0",
    "ruff>=0.16.4",
]

[project.scripts]
mcp-server = "mcp_server.__main__:main"
shell = "shell.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat top-level packages under src/ (ADR-0002). `sources = ["src"]` maps
# src/<pkg> -> importable top-level <pkg>.
sources = ["src"]
packages = [
    "src/contract",
    "src/rules_core",
    "src/rules_data",
    "src/mcp_server",
    "src/agui",
    "src/agent",
    "src/shell",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "standard"     # or "basic" for even less
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
